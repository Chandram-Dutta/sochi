# Releases are made on GitHub: draft a release with a tag like v0.1.0 and publish it.
# This workflow then builds the universal binary for that tag, attaches it (with its checksum) to the release,
# and points the Homebrew formula at it. The GitHub Releases page is the record of what shipped.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build universal binary
        run: scripts/build-release.sh "${{ github.event.release.tag_name }}"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/sochi-macos-universal.tar.gz dist/sochi-macos-universal.tar.gz.sha256 --clobber

      - name: Point the Homebrew formula at this release
        if: ${{ !github.event.release.prerelease }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          sha="$(awk '{print $1}' dist/sochi-macos-universal.tar.gz.sha256)"
          git fetch origin main
          git checkout main
          sed -i '' -E \
            -e "s|releases/download/v[^/]+/|releases/download/v$version/|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            -e "s|^  version \".*\"|  version \"$version\"|" \
            Formula/sochi.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Homebrew: sochi $version"
          git push origin main
